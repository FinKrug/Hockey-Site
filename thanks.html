<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – SRVC Hockey</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #e6eec9; /* soft green background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
            border-top: 10px solid #7d8a35; /* SRVC deep green accent */
        }

        h1 {
            color: #4B5320; /* deep green header */
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            color: #333;
            font-size: 18px;
            margin: 10px 0;
            line-height: 1.5;
        }

        a.button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #7d8a35; /* SRVC green */
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        a.button:hover {
            background-color: #4B5320; /* darker hover */
        }

        .secondary {
            background-color: #4B5320; /* darker green for contrast */
        }

        .secondary:hover {
            background-color: #2f3614;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Thank You for Registering!</h1>

        <p>Your SRVC Hockey Camp registration has been successfully submitted.</p>
        <p>We’re excited to have you join us and will follow up with additional details soon.</p>

        <a class="button" href="index.html">Return Home</a>
        <a class="button secondary" href="register.html?new=true">Register Another Participant</a>
    </div>
</body>
</html>
